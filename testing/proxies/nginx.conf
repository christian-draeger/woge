# Template used by stream-probe.py; substitute ports/upstream for a local nginx installation.
events {}
http {
    access_log off;
    server {
        listen 127.0.0.1:@PORT@;
        location / {
            proxy_pass http://@UPSTREAM@;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_read_timeout 10s;
            gzip off;
        }
    }
}
