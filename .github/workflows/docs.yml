name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "scripts/validate-adrs.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "scripts/validate-adrs.sh"

permissions:
  contents: read

jobs:
  validate-adrs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate architecture decisions
        run: ./scripts/validate-adrs.sh
