name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  todo-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/todo-spring-boot/package-lock.json
      - name: Verify the clean consumer against GitHub Packages
        working-directory: examples/todo-spring-boot
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew check bootJar --console=plain
      - name: Install the test-only browser dependencies
        working-directory: examples/todo-spring-boot
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify native and enhanced Todo journeys
        working-directory: examples/todo-spring-boot
        run: npm run test:browser
      - name: Upload Todo consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: todo-consumer-evidence
          if-no-files-found: warn
          path: |
            examples/todo-spring-boot/build/reports/**
            examples/todo-spring-boot/build/test-results/**
            examples/todo-spring-boot/playwright-report/**
            examples/todo-spring-boot/test-results/**

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run clean repository gate without task-output caches
        run: ./gradlew clean check --no-build-cache --stacktrace
      - name: Verify real streaming behind nginx on every host
        timeout-minutes: 3
        run: |
          docker pull nginx:1.28-alpine
          WOGE_STREAM_PROXY_SCRIPT="$PWD/testing/proxies/stream-probe.py" \
            ./gradlew :woge-spring-mvc:test :woge-spring-webflux:test :woge-ktor:test \
            --tests '*AdapterTckTest' --console=plain
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**

  production-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify real reference container smoke and rolling updates
        run: ./gradlew productionDeploymentTest --console=plain --stacktrace
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment-evidence
          if-no-files-found: warn
          path: build/issue61/**

  reference-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/woge-fallback-client/package-lock.json
            scaffolds/spring-boot/package-lock.json
            examples/tailwind-spring-boot/package-lock.json
            examples/vite-spring-boot/package-lock.json
      - name: Install and build the browser-test client
        working-directory: client/woge-fallback-client
        run: |
          npm ci
          npm run build
      - name: Install pinned browser engines
        working-directory: client/woge-fallback-client
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the reference application browser gate
        run: ./gradlew referenceBrowserSmoke --stacktrace
      - name: Run native form browser contracts on all hosts
        run: |
          WOGE_NATIVE_BROWSER_SCRIPT="$PWD/client/woge-fallback-client/scripts/test-native-forms.mjs" \
            ./gradlew :woge-spring-mvc:test :woge-spring-webflux:test :woge-ktor:test \
            --tests '*AdapterTckTest' --stacktrace
      - name: Run experimental native DPU conformance on all hosts
        run: |
          ./gradlew :woge-spring-mvc:nativeDpuBrowserTest \
            :woge-spring-webflux:nativeDpuBrowserTest \
            :woge-ktor:nativeDpuBrowserTest --stacktrace
      - name: Upload reference-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-browser-evidence
          if-no-files-found: warn
          path: |
            client/woge-fallback-client/build/browser-budget-*.json
            client/woge-fallback-client/playwright-report/**
            client/woge-fallback-client/test-results/**

  example-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/woge-fallback-client/package-lock.json
            scaffolds/spring-boot/package-lock.json
            examples/tailwind-spring-boot/package-lock.json
            examples/vite-spring-boot/package-lock.json
      - name: Install and build the browser-test client
        working-directory: client/woge-fallback-client
        run: |
          npm ci
          npm run build
      - name: Install pinned browser engines
        working-directory: client/woge-fallback-client
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run source-owned component browser contracts
        run: ./gradlew :woge-component-registry:componentBrowserTest --stacktrace
      - name: Run the external Spring Boot scaffold browser gate
        run: ./gradlew scaffoldBrowserSmoke --stacktrace
      - name: Run the wogeDev edit loop in the external Spring Boot scaffold
        run: ./gradlew scaffoldDevSmoke --stacktrace
      - name: Build the Tailwind example with npm
        run: ./gradlew testTailwindExample --stacktrace
      - name: Build and develop the Vite example with npm
        run: ./gradlew testViteExample --stacktrace
      - name: Run the development SSE and overlay browser gate
        working-directory: client/woge-fallback-client
        run: npx playwright test --config=playwright.development.config.mjs
      - name: Upload example-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-browser-evidence
          if-no-files-found: warn
          path: |
            client/woge-fallback-client/playwright-report/**
            client/woge-fallback-client/test-results/**
            build/reports/scaffold-browser/**
            **/build/reports/**
            **/build/test-results/**
