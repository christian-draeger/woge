name: Multipart diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/multipart-diagnostics.yml
      - testing/diagnostics/**
      - testing/woge-adapter-tck/src/main/kotlin/dev/woge/tck/TckUpload*.kt
      - testing/woge-adapter-tck/src/main/kotlin/dev/woge/tck/UploadDiagnosticPublisher.kt
      - testing/woge-adapter-tck/src/main/kotlin/dev/woge/tck/ServerAdapterContract.kt
      - adapters/woge-spring-webflux/src/test/kotlin/dev/woge/spring/webflux/UploadDiagnosticHandler.kt
      - adapters/woge-spring-webflux/src/test/kotlin/dev/woge/spring/webflux/UploadTransportDiagnostics.kt
      - adapters/woge-spring-webflux/src/test/kotlin/dev/woge/spring/webflux/WogeWebFluxAdapterTckTest.kt
  workflow_dispatch:
    inputs:
      proxy_kernel_control:
        description: Correlate only the synthetic WebFlux listener during the standard nginx step
        type: boolean
        default: false
      loopback_kernel_control:
        description: Run the isolated WebFlux TCP metadata control
        type: boolean
        default: false
      loopback_parallel_hosts:
        description: Run MVC and Ktor alongside WebFlux in the loopback control
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-amd64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.loopback_kernel_control }}
    runs-on: ${{ inputs.proxy_kernel_control && 'ubuntu-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      WOGE_TCK_UPLOAD_DIAGNOSTICS: "true"
      WOGE_TCK_UPLOAD_TRANSPORT_DIAGNOSTICS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Confirm native Linux amd64 runner
        run: test "$(uname -m)" = x86_64
      - name: Run the original clean root gate
        run: ./gradlew clean check --no-build-cache --stacktrace
      - name: Retain clean-gate reports before repeated TCK executions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multipart-clean-gate
          path: |
            **/build/reports/**
            **/build/test-results/**
      - name: Pull the original proxy image
        run: docker pull nginx:1.28-alpine
      - name: Capture the synthetic WebFlux listener during the original nginx step
        if: ${{ inputs.proxy_kernel_control }}
        timeout-minutes: 3
        run: |
          command -v tcpdump || { sudo -n apt-get update -qq && sudo -n apt-get install -y --no-install-recommends tcpdump; }
          python3 testing/diagnostics/multipart-proxy-kernel.py
      - name: Retain standard nginx capture and test reports
        if: ${{ always() && inputs.proxy_kernel_control }}
        uses: actions/upload-artifact@v7
        with:
          name: multipart-proxy-loopback
          path: |
            build/multipart-proxy-loopback/**
            **/build/test-results/**
      - name: Compare three parallel and three serial three-host attempts
        if: ${{ !inputs.proxy_kernel_control }}
        timeout-minutes: 7
        run: python3 testing/diagnostics/multipart-ci.py
      - name: Retain every attempt including the first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multipart-diagnostic-attempts
          path: build/multipart-diagnostics/**

  loopback-kernel-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.loopback_kernel_control }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WOGE_LOOPBACK_PARALLEL_HOSTS: ${{ inputs.loopback_parallel_hosts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare native runner tools
        run: |
          test "$(uname -m)" = x86_64
          if ! command -v ip >/dev/null || ! command -v tcpdump >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y --no-install-recommends iproute2 tcpdump
          fi
      - name: Prepare the offline WebFlux test runtime
        run: |
          mkdir -p build/multipart-loopback
          tasks=(:woge-spring-webflux:test --tests '*WebFluxSecurityFormTest')
          if [[ "$WOGE_LOOPBACK_PARALLEL_HOSTS" == true ]]; then
            tasks+=(:woge-spring-mvc:test --tests '*SpringSecurityFormTest')
            tasks+=(:woge-ktor:test --tests '*KtorSecurityFormTest')
          fi
          ./gradlew --no-daemon --no-build-cache --console=plain \
            "${tasks[@]}" 2>&1 | tee build/multipart-loopback/prepare.log
        shell: bash
      - name: Run bounded TCP metadata control
        timeout-minutes: 5
        run: |
          arguments=()
          if [[ "$WOGE_LOOPBACK_PARALLEL_HOSTS" == true ]]; then
            arguments+=(--parallel-hosts)
          fi
          python3 testing/diagnostics/multipart-kernel-control.py "${arguments[@]}"
      - name: Retain loopback metadata and first failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multipart-loopback-kernel-control
          path: build/multipart-loopback/**
