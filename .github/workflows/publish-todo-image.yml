name: Publish Todo image

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Current verified main HEAD (40-character SHA)
        required: true
        type: string
      version:
        description: Fresh immutable Todo image version (for example 0.1.0-demo.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: woge-todo-image-publication
  cancel-in-progress: false

jobs:
  gate:
    name: Todo image gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      statuses: read
      packages: read
    steps:
      - name: Require the current main SHA before checking out input
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$COMMIT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify source and image version
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/verify-publication-commit.py "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          python3 - "$VERSION" <<'PY'
          import re, sys
          assert re.fullmatch(r"[0-9][0-9A-Za-z_.-]{0,100}", sys.argv[1]), "Use a fresh versioned image tag"
          PY
      - name: Verify the published consumer and actual container
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          ./examples/todo-spring-boot/gradlew --project-dir examples/todo-spring-boot check bootJar --console=plain
          docker build --tag woge-todo:verified --build-arg "VERSION=$VERSION" --build-arg "REVISION=$COMMIT" examples/todo-spring-boot
          python3 scripts/test-todo-container.py woge-todo:verified
      - name: Recheck main before publication
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: python3 scripts/verify-publication-commit.py "$COMMIT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: todo-image-gate-evidence
          path: build/todo-container/**

  publish:
    name: Publish Todo image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the pinned production JAR
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
        run: ./examples/todo-spring-boot/gradlew --project-dir examples/todo-spring-boot bootJar --console=plain
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select a fresh image coordinate
        id: coordinate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-todo"
          if docker buildx imagetools inspect "$image:$VERSION" > /tmp/todo-manifest.out 2> /tmp/todo-manifest.err; then
            echo "Image tag already exists; choose a fresh version." >&2
            exit 1
          fi
          if ! grep -Eiq 'manifest unknown|not found' /tmp/todo-manifest.err; then
            cat /tmp/todo-manifest.err >&2
            exit 1
          fi
          echo "image=$image:$VERSION" >> "$GITHUB_OUTPUT"
      - name: Recheck verified main immediately before pushing
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: python3 scripts/verify-publication-commit.py "$COMMIT"
      - name: Publish image, provenance and SBOM
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: examples/todo-spring-boot
          push: true
          platforms: linux/amd64
          tags: ${{ steps.coordinate.outputs.image }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ inputs.commit }}
          provenance: mode=max
          sbom: true
      - name: Record immutable digest
        env:
          IMAGE: ${{ steps.coordinate.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
