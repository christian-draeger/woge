name: Component distribution spike

on:
  pull_request:
    paths:
      - "spikes/component-distribution/**"
      - "docs/architecture/component-distribution.md"
      - "docs/adr/0018-hybrid-headless-and-source-owned-components.md"
      - ".github/workflows/component-distribution-spike.yml"
  push:
    branches:
      - main
    paths:
      - "spikes/component-distribution/**"
      - "docs/architecture/component-distribution.md"
      - "docs/adr/0018-hybrid-headless-and-source-owned-components.md"
      - ".github/workflows/component-distribution-spike.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: ./spikes/component-distribution/validate.sh
