name: Tailwind Kotlin spike

on:
  pull_request:
    paths:
      - "spikes/tailwind-kotlin/**"
      - ".github/workflows/tailwind-kotlin-spike.yml"
  push:
    branches:
      - main
    paths:
      - "spikes/tailwind-kotlin/**"
      - ".github/workflows/tailwind-kotlin-spike.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spikes/tailwind-kotlin/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: spikes/tailwind-kotlin
      - run: ./spikes/tailwind-kotlin/validate.sh
