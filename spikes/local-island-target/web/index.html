<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Garden notes — local counter</title>
<style>
:root { --surface: light-dark(#f8fafc, #111827); --text: light-dark(#172033, #f8fafc); --accent: light-dark(#3451d1, #8ea2ff); color-scheme: light dark; }
body { color: var(--text); background: var(--surface); font-family: system-ui; margin: 2rem; }
input { margin-block: .5rem; }
:focus-visible { outline: .2rem solid var(--accent); outline-offset: .2rem; }
</style>
<main>
<h1>Garden notes</h1>
<ul><li>Water the herbs</li></ul>
<form method="post" action="/notes">
<label for="note-text">New note</label>
<input id="note-text" name="text" required maxlength="120" aria-describedby="note-counter">
<p id="note-counter" role="status">Enter a note of up to 120 characters. Validation also happens on the server.</p>
<button>Add note</button>
</form>
</main>
<script type="application/json" id="note-props">{"maxLength":120}</script>
</html>
