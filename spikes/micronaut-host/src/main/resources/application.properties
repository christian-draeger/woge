micronaut.server.host=127.0.0.1
micronaut.router.static-resources.todo.mapping=/**
micronaut.router.static-resources.todo.paths=classpath:static
micronaut.server.max-request-size=16384
micronaut.security.intercept-url-map[0].pattern=/todo.css
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/assets/woge/**
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
