events {}

http {
    access_log off;
    error_log stderr warn;

    upstream clinic_a { server @UPSTREAM_HOST@:@NODE_A@; }
    upstream clinic_b { server @UPSTREAM_HOST@:@NODE_B@; }
    map $http_x_woge_fixture_node $clinic_upstream {
        default clinic_a;
        b clinic_b;
    }

    server {
        listen @LISTEN@ ssl;
        http2 on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /woge-ingress/server.pem;
        ssl_certificate_key /woge-ingress/server.key;

        location / {
            proxy_pass http://$clinic_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1:@PUBLIC_PORT@;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host 127.0.0.1:@PUBLIC_PORT@;
            proxy_set_header X-Forwarded-Port @PUBLIC_PORT@;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header X-Woge-Fixture-Node "";
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_read_timeout 25s;
            gzip off;
            add_header X-Woge-Fixture-Upstream $upstream_addr always;
        }
    }
}
