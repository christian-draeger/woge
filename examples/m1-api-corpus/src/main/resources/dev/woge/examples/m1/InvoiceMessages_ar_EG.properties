paymentTimeGap=هذا الوقت المحلي غير موجود في برلين بسبب تقديم الساعة. اختر وقتًا آخر.
paymentTimeOverlap=يتكرر هذا الوقت المحلي في برلين بسبب تأخير الساعة. اختر وقتًا لا يتكرر.
languageChanged=تغيرت لغة النموذج. راجع المبلغ والتواريخ ثم أرسل النموذج مجددًا.
invalidField=راجع القيمة المدخلة.
accepted=تم التحقق: {0} EUR، تاريخ الخدمة {1}، الاستحقاق {2}. وقت الدفع: {3}.
failed=تعذر التحقق من الفاتورة.
