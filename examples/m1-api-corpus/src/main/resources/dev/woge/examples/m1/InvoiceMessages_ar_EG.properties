title=التحقق من الفاتورة
amount=المبلغ (EUR)
serviceDay=تاريخ تقديم الخدمة
dueDay=تاريخ الاستحقاق (يوم/شهر/سنة)
submit=تحقق من الفاتورة
summary=راجع البيانات المدخلة
amountError=أدخل المبلغ بالأرقام العربية الهندية مع منزلتين عشريتين على الأكثر ومن دون فواصل الآلاف.
serviceDayError=اختر تاريخًا صحيحًا لتقديم الخدمة.
dueDayError=أدخل تاريخًا صحيحًا بالأرقام العربية الهندية بالترتيب يوم/شهر/سنة.
paymentTime=وقت الدفع (Europe/Berlin، YYYY-MM-DDTHH:mm)
